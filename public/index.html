<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03050a">
<meta name="description" content="지구에서 시작해 태양계 전체로. 실제 궤도 값으로 움직이는 3D 태양계와 내 생일의 하늘.">
<meta property="og:title" content="우리의 우주">
<meta property="og:description" content="실제 궤도 값으로 움직이는 3D 태양계 — 내 생일엔 행성이 어디 있었을까?">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23f4b968'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='5' fill='none' stroke='%23e9eef8' stroke-width='1.5' transform='rotate(-20 16 16)'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>
<body>
<title>우리의 우주</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 화면 전체가 우주. 위=이름과 언어·설정, 아래=천체 고르기와 시간 막대, 오른쪽=천체 카드, 왼쪽=설정 서랍 */
:root{
  color-scheme: dark;
  --void:#03050a;
  --glass:rgba(12,16,27,.78);
  --glass-strong:rgba(14,19,31,.94);
  --line:rgba(170,190,230,.14);
  --line-strong:rgba(170,190,230,.28);
  --fg:#e9eef8;
  --muted:#8f9ab3;
  --sun:#f4b968;
  --ice:#8fc3ff;
  --font-display:'Gowun Batang','Noto Serif KR','Noto Serif JP','Noto Serif SC',Georgia,serif;
  --font-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Hiragino Sans','PingFang SC','Malgun Gothic',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--void);color:var(--fg);font-family:var(--font-body);overflow:hidden;font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#scene.hover{cursor:pointer}

/* 이름표 */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;display:flex;align-items:center;gap:7px;pointer-events:auto;cursor:pointer;will-change:transform;user-select:none;-webkit-user-select:none}
.lbl i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--c,#fff);flex:0 0 auto;opacity:.85}
.lbl span{font-size:12.5px;white-space:nowrap;color:var(--fg);text-shadow:0 0 6px #000,0 0 2px #000;padding:2px 7px;border-radius:999px;transition:background .15s}
.lbl.moon span{font-size:11px;color:#b9c2d6}
.lbl.moon i{width:6px;height:6px;border-width:1px}
.lbl.big i{visibility:hidden}
.lbl:hover span,.lbl.hover span{background:rgba(255,255,255,.12)}
.lbl.on span{background:rgba(244,185,104,.18);color:var(--sun)}
.lbl:focus-visible{outline:none}
.lbl:focus-visible span{outline:2px solid var(--ice)}

/* 위쪽 */
#top{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:calc(18px + env(safe-area-inset-left,0px));right:calc(18px + env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
#brand{pointer-events:auto;cursor:pointer;background:none;border:0;padding:0;text-align:left}
#brand .word{white-space:nowrap;font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:.01em;line-height:1.1}
#brand .sub{font-size:11px;letter-spacing:.22em;color:var(--muted);margin-top:3px;text-transform:uppercase}
.topbtns{display:flex;gap:8px;pointer-events:auto}
.iconbtn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:pointer;font-size:13px}
.iconbtn:hover{border-color:var(--line-strong)}
.iconbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}
#langSel{appearance:none;-webkit-appearance:none;width:100%;background:transparent;border:0;color:var(--fg);font:inherit;font-size:14px;cursor:pointer;padding:10px 30px 10px 38px}
.langwrap{position:relative;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03)}
.langwrap:hover{border-color:var(--line-strong)}
.langwrap svg{position:absolute;left:12px;top:50%;width:16px;height:16px;transform:translateY(-50%);fill:none;stroke:currentColor;stroke-width:1.6;opacity:.8;pointer-events:none}
.langwrap::after{content:'';position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
body.setopen #hCard{display:none!important}
#langSel option{background:#0e1320;color:#e9eef8}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}

/* 아래: 천체 고르기 + 시간 막대 */
#bottom{position:fixed;left:0;right:0;bottom:0;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;
  background:linear-gradient(to top,rgba(3,5,10,.85),rgba(3,5,10,0));padding-top:40px}
#picker{display:flex;gap:4px;overflow-x:auto;max-width:100%;pointer-events:auto;scrollbar-width:none;padding:2px}
#picker::-webkit-scrollbar{display:none}
.pick{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;padding:6px 2px 5px;border-radius:12px;background:transparent;border:1px solid transparent;cursor:pointer}
.pick img{width:34px;height:34px;transition:transform .2s}
.pick span{font-size:11.5px;color:#c3cbdc;white-space:nowrap}
.pick:hover img{transform:scale(1.12)}
.pick.on{background:rgba(255,255,255,.06);border-color:var(--line-strong)}
.pick.on span{color:var(--sun)}
.pick.all .allicon{width:34px;height:34px;display:grid;place-items:center}
.pick.all svg{width:28px;height:28px;stroke:#c3cbdc;fill:none;stroke-width:1.2}
#dock{pointer-events:auto;display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);max-width:100%;overflow-x:auto;scrollbar-width:none}
#dock::-webkit-scrollbar{display:none}
.round{flex:0 0 auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line);cursor:pointer}
.round svg{width:15px;height:15px;fill:currentColor}
.round.on{color:var(--sun);border-color:var(--sun)}
#clock{flex:0 0 auto;font-family:var(--font-mono);font-size:12.5px;font-variant-numeric:tabular-nums;padding:0 8px;min-width:170px;text-align:center;line-height:1.25}
#clock small{display:block;font-size:10.5px;color:var(--muted);font-family:var(--font-body)}
.sep{width:1px;height:22px;background:var(--line);flex:0 0 auto}
.chiplbl{font-size:11px;color:var(--muted);padding:0 2px 0 4px;flex:0 0 auto;white-space:nowrap}
.spd{flex:0 0 auto;height:30px;padding:0 11px;border-radius:999px;background:transparent;border:1px solid transparent;cursor:pointer;font-size:12.5px;white-space:nowrap;color:#c8d0e0}
.spd:hover{background:rgba(255,255,255,.06)}
.spd.on{border-color:var(--sun);color:var(--sun)}
.txtbtn{flex:0 0 auto;height:30px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);cursor:pointer;font-size:12.5px;white-space:nowrap}

/* 정보 카드 */
#info,#bday{position:fixed;top:calc(72px + env(safe-area-inset-top,0px));right:calc(18px + env(safe-area-inset-right,0px));width:340px;max-height:calc(100% - 72px - 200px);overflow:auto;border-radius:16px;background:var(--glass-strong);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  display:flex;flex-direction:column;gap:16px;padding:18px;animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ihead{display:flex;gap:14px;align-items:center}
.ihead img{width:68px;height:68px;flex:0 0 auto}
.ihead>div{min-width:0}
.kind{font-size:11px;letter-spacing:.08em;color:var(--muted)}
#iName{font-family:var(--font-display);font-size:28px;font-weight:700;line-height:1.15;text-wrap:balance}
#iAlt{font-size:12px;color:var(--muted)}
#iClose{position:absolute;top:12px;right:12px;width:30px;height:30px}
#iClose svg{width:12px;height:12px;stroke:currentColor;stroke-width:2;fill:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.tile .k{font-size:11px;color:var(--muted)}
.tile .v{font-family:var(--font-mono);font-size:15.5px;font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.tile .s{font-size:11px;color:var(--sun);margin-top:1px}
.cmp{display:flex;flex-direction:column;gap:8px}
.cmp .row{display:flex;align-items:flex-end;justify-content:center;gap:22px;min-height:40px;padding:6px 0}
.cmp figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:5px}
.cmp figure img{display:block}
.cmp figcaption{font-size:11px;color:var(--muted)}
.h3{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:0;text-transform:uppercase}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:12.5px}
dt{color:var(--muted)}
dd{margin:0;font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer}
.chip:hover{border-color:var(--ice)}
.chip.on{border-color:var(--sun);color:var(--sun)}
#iNotes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;font-size:13px;line-height:1.65}
#iNotes li{padding-left:14px;position:relative}
#iNotes li::before{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--sun)}
.fallback{font-size:11px;color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:8px}
.actions{display:flex;gap:6px;flex-wrap:wrap}

/* 설정 서랍 */
#settings{position:fixed;top:calc(72px + env(safe-area-inset-top,0px));left:calc(18px + env(safe-area-inset-left,0px));width:300px;max-height:calc(100% - 72px - 200px);overflow:auto;border-radius:16px;background:var(--glass-strong);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:18px;display:flex;flex-direction:column;gap:18px;animation:rise .25s ease}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:3px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.seg button{height:32px;border-radius:8px;border:0;background:transparent;cursor:pointer;font-size:12.5px;color:#c3cbdc}
.seg button.on{background:rgba(244,185,104,.16);color:var(--sun)}
.slider{display:flex;flex-direction:column;gap:4px}
.slider .t{display:flex;justify-content:space-between;font-size:12.5px}
.slider output{font-family:var(--font-mono);color:var(--sun);font-variant-numeric:tabular-nums;font-size:12px}
input[type=range]{width:100%;accent-color:var(--sun)}
.check{display:flex;gap:9px;align-items:center;font-size:13px;cursor:pointer}
.check input{accent-color:var(--sun);width:15px;height:15px}
.hint{font-size:12px;color:var(--muted);line-height:1.6;margin:0}
kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line-strong);border-radius:4px;padding:0 4px}

#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:10px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);font-size:13px;white-space:nowrap;transition:opacity .6s;pointer-events:none;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#toast.gone{opacity:0}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:var(--void);z-index:20;color:var(--muted)}
#loading .word{font-family:var(--font-display);font-size:30px;color:var(--fg);font-weight:700}
#loading .bar{width:160px;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
#loading .bar i{display:block;height:100%;width:40%;background:var(--sun);animation:load 1.2s ease-in-out infinite}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(250%)}}

/* 첫 화면 연출 */
body.intro #bottom,body.intro #labels,body.intro #toast,body.intro #setBtn,body.intro #bdayBtn,body.intro #tourBtn,body.intro #histBtn,body.intro #voyBtn{opacity:0;pointer-events:none}
/* 우주 주소 여행 */
body.tour #bottom,body.tour #labels,body.tour #toast,body.tour #setBtn,body.tour #bdayBtn,body.tour #tourBtn,body.tour #histBtn,body.tour #voyBtn,body.tour #info,body.tour #bday,body.tour #settings{opacity:0;pointer-events:none}
body.cosmic #labels{display:none}
#cosLabels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#cosLabels .cl{position:absolute;left:0;top:0;display:flex;align-items:center;gap:7px;font-size:12.5px;white-space:nowrap;text-shadow:0 0 6px #000,0 0 2px #000;will-change:transform;transition:opacity .4s}
#cosLabels .cl i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--sun)}
#cosLabels .cl.here span{color:var(--sun)}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s;z-index:9}
#fade.on{opacity:1}
#tour{position:fixed;inset:0;z-index:8;pointer-events:none}
#tourBox{position:absolute;left:50%;bottom:calc(9% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(680px,calc(100% - 32px));display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
#tourBox::before{content:"";position:absolute;inset:-50px -40px -30px;z-index:-1;background:radial-gradient(closest-side,rgba(3,5,10,.7),rgba(3,5,10,0))}
#addrTrail{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 8px;font-size:12.5px;color:var(--muted)}
#addrTrail span::after{content:" ›";opacity:.6}
#addrTrail span:last-child::after{content:""}
#addrNow,#addrCap,#intro .line,#introEnd .word{word-break:keep-all;overflow-wrap:anywhere}
#addrNow{font-family:var(--font-display);font-size:40px;font-weight:700;line-height:1.15;text-wrap:balance;text-shadow:0 0 24px rgba(0,0,0,.8)}
#addrCap{font-size:14px;line-height:1.6;color:#d6dcea;max-width:560px;text-wrap:balance}
#addrNow,#addrCap{transition:opacity .5s}
#addrNow.dim,#addrCap.dim{opacity:0}
#tourEnd{display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:auto;margin-top:6px}
#tourEnd .primary,#tourEnd .ghost{width:min(340px,100%)}
#tourSkip{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));pointer-events:auto}
.linkbtn{background:none;border:0;color:var(--ice);font-size:13.5px;cursor:pointer;padding:6px 8px;text-decoration:underline;text-underline-offset:3px}
#bottom,#labels,#setBtn,#bdayBtn{transition:opacity .9s}
#intro{position:fixed;inset:0;z-index:8;pointer-events:none;background:radial-gradient(ellipse at center,rgba(3,5,10,0) 45%,rgba(3,5,10,.55) 100%)}
#intro .line{position:absolute;left:50%;bottom:20%;transform:translate(-50%,8px);width:min(760px,calc(100% - 32px));text-align:center;margin:0;
  font-family:var(--font-display);font-size:27px;line-height:1.45;text-wrap:balance;text-shadow:0 0 18px #000,0 0 4px #000;opacity:0;transition:opacity 1s,transform 1s}
#intro .line.show{opacity:1;transform:translate(-50%,0)}
/* 끝 화면: 태양을 가리지 않게 아래 가운데, 엄지로 누르기 쉬운 자리 */
#introEnd{position:absolute;left:50%;top:auto;bottom:calc(9% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(560px,calc(100% - 32px));display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;pointer-events:auto;animation:endRise 1.2s ease}
@keyframes endRise{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
#introEnd .actions .primary,#introEnd .actions .ghost{width:min(340px,100%)}
#introEnd .word{font-family:var(--font-display);font-size:58px;font-weight:700;line-height:1.1;text-shadow:0 0 30px rgba(0,0,0,.8)}
#introEnd .actions{flex-direction:column;align-items:center;gap:10px}
.primary{height:46px;padding:0 26px;border-radius:999px;background:var(--sun);color:#1b1206;border:0;font-size:15px;font-weight:600;cursor:pointer}
.primary:hover{filter:brightness(1.08)}
.ghost{height:42px;padding:0 20px;border-radius:999px;background:rgba(10,14,24,.6);border:1px solid var(--line-strong);font-size:14px;cursor:pointer;backdrop-filter:blur(8px)}
.ghost:hover{border-color:var(--sun);color:var(--sun)}
#skipBtn{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));pointer-events:auto}
/* 내 생일 카드 */
#bdayForm{display:flex;flex-direction:column;gap:8px}
#bdayForm .row{display:flex;gap:8px;flex-wrap:wrap}
#bdayDate{flex:1 1 150px;height:38px;border-radius:10px;border:1px solid var(--line-strong);background:rgba(255,255,255,.05);color:var(--fg);font:inherit;padding:0 10px;color-scheme:dark}
#bdayForm .primary{height:38px;font-size:13.5px;padding:0 16px}
.err{color:#ff9d8a}
.ages{display:flex;flex-direction:column;gap:2px}
.age{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line)}
.age img{width:24px;height:24px}
.age .n{font-size:13px}
.age .n small{display:block;font-size:11px;color:var(--muted)}
.age .v{font-family:var(--font-mono);font-size:15px;color:var(--sun);font-variant-numeric:tabular-nums;text-align:right}
#traveled{margin:0;font-size:13px;line-height:1.6}
@media (prefers-reduced-motion:reduce){#intro .line{transition:none}#introEnd{animation:none}}

.grab{display:none}
#spdCycle{display:none}
#introEnd::before{content:"";position:absolute;inset:-50px -40px -30px;z-index:-1;background:radial-gradient(closest-side,rgba(3,5,10,.72),rgba(3,5,10,0));pointer-events:none}

@media (max-width:760px){
  #addrNow{font-size:30px}
  #addrCap{font-size:13px}
  #brand .word{font-size:21px}
  .iconbtn .lbltxt{display:none}
  #intro .line{font-size:20px;bottom:24%}
  #introEnd .word{font-size:40px}
  /* 휴대폰: 카드는 아래에서 올라오는 시트, 손잡이로 펼치고 접는다 */
  #info,#bday{left:0;right:0;width:auto;top:auto;bottom:calc(66px + env(safe-area-inset-bottom,0px));max-height:min(46%,420px);border-radius:18px 18px 0 0;
    padding:6px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));gap:14px;transition:max-height .3s ease;border-bottom:0}
  #info.expanded,#bday.expanded{max-height:calc(100% - 140px - env(safe-area-inset-top,0px))}
  .grab{display:flex;justify-content:center;align-items:center;height:22px;flex:0 0 auto;width:100%;background:none;border:0;cursor:pointer;margin-bottom:-6px}
  .grab i{width:38px;height:4px;border-radius:2px;background:var(--line-strong)}
  #iClose{top:14px}
  .ihead img{width:52px;height:52px}
  #iName{font-size:24px}
  .tile{padding:8px 10px}
  .tile .v{font-size:14px}
  body.sheet #picker{display:none}
  body.sheet #bottom{padding-top:8px;background:none}
  #presets,.chiplbl,#dock .sep{display:none!important}

 notes:{ko:['태양계 전체 질량의 약 99.86%를 차지한다. 지름은 약 139만 km.','표면(광구) 온도는 약 5,500°C, 바깥 대기인 코로나는 100만°C가 넘는다.','적도는 약 25.4일, 극 부근은 약 35일에 한 번 돈다(차등 자전). 이 화면은 적도 값으로 돈다.','2024년 10월 NASA·NOAA가 태양 활동 25주기의 극대기 진입을 발표했다.','파커 태양 탐사선이 2024년 12월 24일 태양 표면에서 약 610만 km까지 다가가 가장 가까이 간 인공 물체가 됐다.'],

 {id:'earth',names:['지구','Earth','地球','地球','Tierra'],kind:'rocky',R:6371.0,rot:23.9345,tilt:23.44,pole:[0,90],color:'#4f86c6',look:'earth',moonCount:1,atmo:'#6fa8ff',g:9.81,temp:15,

 {id:'mars',names:['화성','Mars','火星','火星','Marte'],kind:'rocky',R:3389.5,rot:24.6229,tilt:25.19,pole:[317.68,52.89],color:'#d0744a',look:'mars',moonCount:2,atmo:'#e8a27a',g:3.72,temp:-65,

 {id:'jupiter',names:['목성','Jupiter','木星','木星','Júpiter'],kind:'gas',R:69911,rot:9.925,tilt:3.13,pole:[268.06,64.50],color:'#d6b98f',look:'jupiter',moonCount:97,g:24.79,temp:-110,

   en:['About 11 times Earth\'s diameter, and 2.5 times the mass of all other planets combined.','The Great Red Spot keeps shrinking: in the 2020s it is about 13,000–14,000 km wide, barely Earth-sized, and getting rounder.','Juno found a "dilute" core with no sharp boundary.','97 known moons (as of 2025); 16 major ones are shown with real orbital values.','It has faint rings. Europa Clipper (arriving 2030) and JUICE (arriving 2031) are on their way.']}},

const I18X={"notes": {"sun": {"ja": ["太陽系の全質量の約99.86%を占める。直径は約139万km。", "表面（光球）の温度は約5,500°C、外側の大気であるコロナは100万°Cを超える。", "赤道は約25.4日、極付近は約35日で1回転する（差動回転）。この画面では赤道の値で回している。", "2024年10月、NASAとNOAAが太陽活動第25周期の極大期入りを発表した。", "パーカー・ソーラー・プローブは2024年12月24日に太陽表面から約610万kmまで接近し、最も太陽に近づいた人工物となった。"], "zh": ["占太阳系总质量的约99.86%。直径约139万公里。", "表面（光球）温度约5,500°C，外层大气日冕超过100万°C。", "赤道约25.4天自转一周，极区附近约35天（较差自转）。此画面按赤道数值自转。", "2024年10月，NASA和NOAA宣布太阳活动第25周期进入极大期。", "帕克太阳探测器于2024年12月24日飞到距太阳表面约610万公里处，成为离太阳最近的人造物体。"], "es": ["Concentra cerca del 99,86 % de la masa del sistema solar. Mide unos 1,39 millones de km de diámetro.", "La superficie visible (fotosfera) está a unos 5500 °C; la corona, su atmósfera exterior, supera el millón de °C.", "El ecuador gira en unos 25,4 días y las regiones polares en unos 35 (rotación diferencial). Aquí se usa el valor ecuatorial.", "En octubre de 2024, la NASA y la NOAA anunciaron que el ciclo solar 25 había entrado en su periodo de máxima actividad.", "El 24 de diciembre de 2024, la sonda Parker pasó a unos 6,1 millones de km de la superficie solar, el objeto humano que más se ha acercado al Sol."], "fr": ["Il concentre environ 99,86 % de la masse du Système solaire. Son diamètre est d'environ 1,39 million de km.", "La surface visible (photosphère) est à environ 5 500 °C ; la couronne, son atmosphère externe, dépasse 1 million de °C.", "L'équateur tourne en environ 25,4 jours, les pôles en environ 35 jours (rotation différentielle). La valeur équatoriale est utilisée ici.", "En octobre 2024, la NASA et la NOAA ont annoncé que le cycle solaire 25 était entré dans sa période de maximum.", "Le 24 décembre 2024, la sonde Parker Solar Probe est passée à environ 6,1 millions de km de la surface du Soleil, l'objet fabriqué par l'homme qui s'en est le plus approché."]}, "mercury": {"ja": ["公転1回（88日）の間に自転を1.5回する（3:2共鳴）。そのため日の出から次の日の出まで約176日かかる。", "軌道離心率0.21は惑星の中で最も軌道がゆがんでいる。昼は430°C、夜は−180°Cまで変わる。", "極地方のいつも影になっているクレーターの中に水の氷がある（メッセンジャー探査機）。", "欧州と日本の共同探査機ベピコロンボが2026年11月に水星周回軌道に入る予定である。"], "zh": ["公转一圈（88天）期间自转1.5圈（3:2共振）。因此从日出到下一次日出约需176天。", "轨道偏心率0.21，是行星中轨道最扁的。白天高达430°C，夜晚低至−180°C。", "极地终年不见阳光的陨击坑中存在水冰（信使号探测器）。", "欧洲与日本联合研制的贝皮可伦坡号预计于2026年11月进入水星轨道。"], "es": ["Gira 1,5 veces sobre sí mismo durante cada órbita de 88 días (resonancia 3:2), por lo que de un amanecer al siguiente pasan unos 176 días.", "Con una excentricidad de 0,21 tiene la órbita más alargada de todos los planetas. De día llega a 430 °C y de noche baja a −180 °C.", "Hay hielo de agua en cráteres polares permanentemente en sombra (sonda MESSENGER).", "La misión europeo-japonesa BepiColombo entrará en órbita de Mercurio en noviembre de 2026."], "fr": ["Il tourne 1,5 fois sur lui-même pendant chaque révolution de 88 jours (résonance 3:2) : d'un lever de Soleil au suivant, il s'écoule environ 176 jours.", "Avec une excentricité de 0,21, c'est la planète dont l'orbite est la plus allongée. La température passe de 430 °C le jour à −180 °C la nuit.", "De la glace d'eau subsiste dans des cratères polaires en permanence à l'ombre (sonde MESSENGER).", "La mission européano-japonaise BepiColombo doit entrer en orbite autour de Mercure en novembre 2026."]}, "venus": {"ja": ["他の惑星とは逆向きに自転する。自転周期（243日）が公転周期（225日）より長い。", "厚い二酸化炭素の大気のため、表面は約465°C、気圧は地球の約92倍である。", "雲の頂は4日で惑星を1周する風（スーパーローテーション）に乗って動いている。", "マゼラン探査機のレーダーデータを再解析した研究（2023・2024年）で、最近の火山噴火の痕跡が見つかった。", "表面は雲に隠れて見えないので、ここでは雲の層を描いた。"], "zh": ["自转方向与其他行星相反。自转周期（243天）比公转周期（225天）还长。", "由于浓厚的二氧化碳大气，表面温度约465°C，气压约为地球的92倍。", "云顶随着4天绕行星一周的大气环流（超级自转）移动。", "对麦哲伦号雷达数据的重新分析（2023、2024年）发现了近期火山喷发的痕迹。", "表面被云层遮住看不见，所以这里画的是云层。"], "es": ["Gira en sentido contrario al de los demás planetas. Su rotación (243 días) es más larga que su año (225 días).", "Una densa atmósfera de dióxido de carbono mantiene la superficie en torno a 465 °C, con una presión unas 92 veces la terrestre.", "Las cimas de las nubes dan la vuelta al planeta en unos cuatro días arrastradas por los vientos (superrotación).", "Nuevos análisis de los datos de radar de Magallanes (2023 y 2024) hallaron indicios de erupciones volcánicas recientes.", "La superficie queda oculta por las nubes, así que aquí se muestra la capa de nubes."], "fr": ["Elle tourne dans le sens inverse des autres planètes. Sa rotation (243 jours) est plus longue que son année (225 jours).", "Une épaisse atmosphère de dioxyde de carbone maintient la surface à environ 465 °C, sous une pression environ 92 fois celle de la Terre.", "Le sommet des nuages fait le tour de la planète en environ 4 jours, entraîné par les vents (super-rotation).", "De nouvelles analyses des données radar de Magellan (2023, 2024) ont révélé des traces d'éruptions volcaniques récentes.", "La surface est cachée par les nuages ; c'est donc la couche nuageuse qui est représentée ici."]}, "earth": {"ja": ["自転軸が23.44°傾いているので季節が生まれる。", "表面の約71%が海である。私たちは今、秒速約30kmで太陽のまわりを回っている。", "この画面の昼と夜の境目は、下の時間バーの日付・時刻（協定世界時）に合わせて計算している。", "大陸は単純化した輪郭で描いた。"], "zh": ["自转轴倾斜23.44°，因此有了四季。", "表面约71%是海洋。我们此刻正以每秒约30公里的速度绕太阳运行。", "此画面中的昼夜分界线，是按下方时间条的日期和时刻（协调世界时）计算的。", "大陆用简化的轮廓绘制。"], "es": ["La inclinación de su eje, de 23,44°, produce las estaciones.", "Cerca del 71 % de la superficie es océano. En este momento giramos alrededor del Sol a unos 30 km por segundo.", "El límite entre el día y la noche aquí se calcula según la fecha y la hora (UTC) de la barra de tiempo.", "Los continentes se dibujan con contornos simplificados."], "fr": ["L'inclinaison de son axe, 23,44°, est à l'origine des saisons.", "Environ 71 % de la surface est recouverte par les océans. En ce moment, nous tournons autour du Soleil à environ 30 km par seconde.", "La limite entre le jour et la nuit est calculée d'après la date et l'heure (UTC) de la barre de temps ci-dessous.", "Les continents sont dessinés avec des contours simplifiés."]}, "mars": {"ja": ["1日は24時間37分、自転軸の傾き25.2°で、地球のように季節がある。", "太陽系で最も高いオリンポス山（約22km）と、長さ約4,000kmのマリネリス峡谷がある（峡谷は赤道の下の暗い筋）。", "2025年9月、NASAはパーサヴィアランスが採取した「サファイア・キャニオン」の試料に、生命の痕跡かもしれない模様が見つかったと発表した。まだ確定ではない。", "両極の極冠は水の氷とドライアイスでできている。"], "zh": ["一天为24小时37分，自转轴倾角25.2°，像地球一样有四季。", "拥有太阳系最高的奥林匹斯山（约22公里）和长约4,000公里的水手谷（峡谷是赤道下方的暗色条纹）。", "2025年9月，NASA公布毅力号采集的“蓝宝石峡谷”样本中出现了可能是生命痕迹的纹理。尚未确认。", "两极的极冠由水冰和干冰构成。"], "es": ["Un día dura 24 h 37 min y su inclinación de 25,2° da estaciones como las de la Tierra.", "Alberga el Monte Olimpo (unos 22 km de altura), el volcán más alto conocido, y el Valles Marineris, de unos 4000 km (la franja oscura bajo el ecuador).", "En septiembre de 2025, la NASA informó de posibles biofirmas en la muestra «Sapphire Canyon» de Perseverance. Aún no está confirmado.", "Los casquetes polares son de hielo de agua y hielo de dióxido de carbono."], "fr": ["Un jour dure 24 h 37 min et l'inclinaison de 25,2° donne des saisons comparables à celles de la Terre.", "Elle abrite Olympus Mons (environ 22 km de haut), le plus grand volcan connu, et Valles Marineris, long de 4 000 km (la bande sombre sous l'équateur).", "En septembre 2025, la NASA a signalé de possibles biosignatures dans l'échantillon « Sapphire Canyon » de Perseverance. Ce n'est pas encore confirmé.", "Les calottes polaires sont faites de glace d'eau et de glace de dioxyde de carbone."]}, "jupiter": {"ja": ["直径は地球の約11倍、質量はほかの惑星をすべて合わせた約2.5倍である。", "大赤斑は小さくなり続け、2020年代には幅約1.3万〜1.4万kmと、地球がやっと入る大きさである。形もだんだん丸くなっている。", "ジュノー探査機の観測で、中心核は境界のはっきりしない「うすい核」だとわかった。", "確認された衛星は97個（2025年時点）。ここでは代表的な16個を実際の軌道の値で見せている。", "かすかな環がある。エウロパ・クリッパー（2030年到着予定）とジュース（2031年到着予定）が向かっている。"], "zh": ["直径约为地球的11倍，质量约为其他所有行星总和的2.5倍。", "大红斑不断缩小，2020年代宽约1.3万至1.4万公里，勉强能放下一个地球，形状也越来越圆。", "朱诺号的观测发现，其核心是边界不清晰的“稀释核”。", "已确认卫星97颗（截至2025年）。这里按真实轨道数值展示16颗代表性卫星。", "有暗淡的行星环。木卫二快船（预计2030年抵达）和木星冰月探测器（预计2031年抵达）正在前往。"], "es": ["Su diámetro es unas 11 veces el de la Tierra y su masa, unas 2,5 veces la de todos los demás planetas juntos.", "La Gran Mancha Roja sigue encogiendo: en la década de 2020 mide unos 13 000–14 000 km de ancho, apenas el tamaño de la Tierra, y es cada vez más redonda.", "Juno descubrió un núcleo «difuso», sin un límite definido.", "Tiene 97 lunas conocidas (en 2025); aquí se muestran 16 principales con sus valores orbitales reales.", "Tiene anillos tenues. Europa Clipper (llegará en 2030) y JUICE (llegará en 2031) están en camino."], "fr": ["Son diamètre vaut environ 11 fois celui de la Terre et sa masse environ 2,5 fois celle de toutes les autres planètes réunies.", "La Grande Tache rouge continue de rétrécir : dans les années 2020, elle mesure environ 13 000 à 14 000 km de large, à peine la taille de la Terre, et devient de plus en plus ronde.", "Juno a découvert un noyau « dilué », sans limite nette.", "On connaît 97 lunes (en 2025) ; 16 des principales sont représentées avec leurs valeurs orbitales réelles.", "Elle possède de faibles anneaux. Europa Clipper (arrivée en 2030) et JUICE (arrivée en 2031) sont en route."]}, "saturn": {"ja": ["平均密度が水より低い（0.69 g/cm³）。", "2025年3月に新たに128個の衛星が公認され、確認された衛星は274個になった。ここでは代表的な15個を実際の軌道の値で見せている。", "2025年3月に地球が土星の環の面を通過し、地球から環がほとんど見えなくなった。環は直径27万kmを超えるが、厚さはほとんどが数十m程度である。", "北極の六角形のジェット気流（1辺が約1.4万km）を描き込んだ。", "環の年齢は数億年と若いというカッシーニのデータの解釈と、もっと古いかもしれないという2024年の反論が併せて議論されている。"], "zh": ["平均密度比水还低（0.69 g/cm³）。", "2025年3月新确认了128颗卫星，已确认卫星增至274颗。这里按真实轨道数值展示15颗代表性卫星。", "2025年3月，地球穿过土星环平面，从地球上几乎看不到土星环。环的直径超过27万公里，但大部分厚度只有几十米。", "画出了北极的六边形急流（每边约1.4万公里）。", "关于土星环的年龄，卡西尼数据的解读认为只有几亿年，较年轻；2024年又有反驳认为可能古老得多，两种观点都在讨论中。"], "es": ["Su densidad media es menor que la del agua (0,69 g/cm³).", "En marzo de 2025 se reconocieron 128 lunas nuevas, con lo que el total asciende a 274; aquí se muestran 15 principales con sus valores orbitales reales.", "En marzo de 2025 la Tierra cruzó el plano de los anillos, y desde aquí casi desaparecieron de la vista. Abarcan más de 270 000 km, pero casi siempre tienen solo decenas de metros de grosor.", "Se ha dibujado la corriente en chorro hexagonal del polo norte (cada lado mide unos 14 000 km).", "Los datos de Cassini sugieren que los anillos tienen solo unos cientos de millones de años; un estudio de 2024 sostiene que podrían ser mucho más antiguos."], "fr": ["Sa masse volumique moyenne est inférieure à celle de l'eau (0,69 g/cm³).", "En mars 2025, 128 nouvelles lunes ont été reconnues, portant le total à 274 ; 15 des principales sont représentées avec leurs valeurs orbitales réelles.", "En mars 2025, la Terre a traversé le plan des anneaux, qui ont presque disparu de notre vue. Ils s'étendent sur plus de 270 000 km, mais n'ont le plus souvent que quelques dizaines de mètres d'épaisseur.", "Le jet-stream hexagonal du pôle nord (chaque côté mesure environ 14 000 km) est dessiné.", "Les données de Cassini suggèrent que les anneaux n'ont que quelques centaines de millions d'années ; une étude de 2024 soutient qu'ils pourraient être bien plus anciens."]}, "uranus": {"ja": ["自転軸が97.8°傾いていて、ほぼ横倒しのまま公転する。", "2025年のハッブル宇宙望遠鏡の観測で、自転周期が17時間14分52秒と新たに測定された。この画面はその値を使っている。", "2024年にオックスフォード大学の研究者がボイジャー2号の写真の色を補正し、天王星と海王星の本当の色はどちらも淡い青緑に近いことを示した。この画面の色はその結果に従った。", "2025年にジェイムズ・ウェッブ宇宙望遠鏡が新しい衛星（S/2025 U1）を見つけ、衛星は29個になった。", "暗くて細い環が13本ある（内側の10本を表示）。"], "zh": ["自转轴倾斜97.8°，几乎是“躺着”绕太阳公转。", "2025年哈勃空间望远镜的观测将其自转周期重新测定为17小时14分52秒。此画面采用该数值。", "2024年牛津大学研究团队校正了旅行者2号照片的色彩，表明天王星和海王星的真实颜色都接近淡青绿色。此画面的颜色依据该结果。", "2025年詹姆斯·韦布空间望远镜发现一颗新卫星（S/2025 U1），卫星数达到29颗。", "有13条暗而细的环（显示内侧10条）。"], "es": ["Con una inclinación de 97,8°, rueda alrededor del Sol casi de costado.", "Las observaciones del Hubble en 2025 precisaron su rotación en 17 h 14 min 52 s, el valor que se usa aquí.", "Un estudio de Oxford de 2024 reequilibró las imágenes del Voyager 2 y mostró que Urano y Neptuno son de un azul verdoso pálido similar. Los colores de aquí siguen ese resultado.", "En 2025 el telescopio espacial James Webb encontró una luna nueva (S/2025 U1), con lo que el total sube a 29.", "Tiene 13 anillos oscuros y estrechos (se muestran los 10 interiores)."], "fr": ["Inclinée de 97,8°, elle roule autour du Soleil presque sur le côté.", "Les observations de Hubble en 2025 ont précisé sa rotation à 17 h 14 min 52 s, valeur utilisée ici.", "Une étude d'Oxford de 2024 a rééquilibré les images de Voyager 2 et montré qu'Uranus et Neptune sont d'un même bleu-vert pâle. Les couleurs affichées ici suivent ce résultat.", "En 2025, le télescope spatial James Webb a découvert une nouvelle lune (S/2025 U1), portant leur nombre à 29.", "Elle possède 13 anneaux sombres et étroits (les 10 intérieurs sont représentés)."]}, "neptune": {"ja": ["太陽から最も遠い惑星で、1周するのに約165年かかる。", "太陽系で最も速い風（時速2,000km以上）が吹く。", "ボイジャー2号の濃い青の写真はコントラストを強めたものである。実際は天王星より少し青い程度だ（2024年の研究）。", "最大の衛星トリトンは逆向きに公転しており、カイパーベルトから捕らえられた天体と考えられている。", "確認された衛星は16個である（2024年に2個追加）。環の中の「環の弧（アーク）」は表示していない。"], "zh": ["离太阳最远的行星，绕太阳一圈约需165年。", "拥有太阳系中最快的风（时速超过2,000公里）。", "旅行者2号拍摄的深蓝色照片经过了增强对比度处理。实际上只比天王星稍蓝一点（2024年研究）。", "最大的卫星海卫一反向公转，被认为是从柯伊伯带捕获的天体。", "已确认卫星16颗（2024年新增2颗）。环中的“环弧”未显示。"], "es": ["Es el planeta más lejano; una órbita dura unos 165 años.", "Tiene los vientos más rápidos del sistema solar, de más de 2000 km/h.", "Las imágenes de azul intenso del Voyager 2 fueron realzadas en contraste; en realidad es solo algo más azul que Urano (estudio de 2024).", "Su luna mayor, Tritón, orbita en sentido contrario y se cree que es un objeto del cinturón de Kuiper capturado.", "Tiene 16 lunas conocidas (2 añadidas en 2024). Los arcos de los anillos no se muestran."], "fr": ["C'est la planète la plus éloignée ; une révolution dure environ 165 ans.", "Elle a les vents les plus rapides du Système solaire, supérieurs à 2 000 km/h.", "Les images d'un bleu profond de Voyager 2 avaient un contraste renforcé ; la planète est en réalité à peine plus bleue qu'Uranus (étude de 2024).", "Sa plus grande lune, Triton, circule à contre-sens et serait un objet de la ceinture de Kuiper capturé.", "On connaît 16 lunes (2 ajoutées en 2024). Les arcs des anneaux ne sont pas représentés."]}, "pluto": {"ja": ["2006年に準惑星に分類し直された。", "2015年にニュー・ホライズンズがハート形のトンボー領域と、窒素の氷の平原（スプートニク平原）を撮影した。", "最大の衛星カロンとは、お互いに同じ面だけを向け合っている（相互の潮汐固定）。", "軌道が大きく傾き（17°）、ゆがんでいるため、一部の区間は海王星より太陽に近い。"], "zh": ["2006年被重新归类为矮行星。", "2015年新视野号拍摄到心形的汤博区和氮冰平原（斯普特尼克平原）。", "与最大的卫星冥卫一始终以同一面相对（相互潮汐锁定）。", "轨道倾斜很大（17°）且很扁，部分路段比海王星更靠近太阳。"], "es": ["Fue reclasificado como planeta enano en 2006.", "En 2015 New Horizons fotografió la Tombaugh Regio, con forma de corazón, y la llanura de hielo de nitrógeno Sputnik Planitia.", "Plutón y su mayor luna, Caronte, se muestran siempre la misma cara (acoplamiento de marea mutuo).", "Su órbita está inclinada 17° y es tan excéntrica que parte de ella queda dentro de la de Neptuno."], "fr": ["Il a été reclassé planète naine en 2006.", "En 2015, New Horizons a photographié la région de Tombaugh, en forme de cœur, et la plaine de glace d'azote Spoutnik Planitia.", "Pluton et sa plus grande lune, Charon, se présentent toujours la même face (verrouillage de marée mutuel).", "Son orbite est inclinée de 17° et si excentrique qu'une partie se trouve à l'intérieur de celle de Neptune."]}}, "moonNotes": {"Moon": {"ja": "いつも同じ面を地球に向けている（この画面でもそうだ）。毎年約3.8cmずつ遠ざかっている。2024年に嫦娥6号が初めて月の裏側の試料を持ち帰った。", "zh": "始终以同一面朝向地球（此画面也是如此）。每年远离约3.8厘米。2024年嫦娥六号首次带回月球背面样本。", "es": "Siempre muestra a la Tierra la misma cara (como aquí). Se aleja unos 3,8 cm cada año. En 2024, Chang'e 6 trajo las primeras muestras de la cara oculta.", "fr": "Elle montre toujours la même face à la Terre (comme ici). Elle s'éloigne d'environ 3,8 cm par an. En 2024, Chang'e 6 a rapporté les premiers échantillons de la face cachée."}, "Phobos": {"ja": "火星にだんだん近づいており、数千万年後には砕けて環になるか、落下すると考えられている。", "zh": "正逐渐靠近火星，预计数千万年后会碎裂成环或坠落到火星上。", "es": "Se acerca en espiral a Marte; dentro de decenas de millones de años se romperá formando un anillo o caerá sobre el planeta.", "fr": "Il se rapproche de Mars en spirale ; dans quelques dizaines de millions d'années, il se brisera en un anneau ou s'écrasera sur la planète."}, "Amalthea": {"ja": "太陽系で最も赤い天体のひとつである。", "zh": "是太阳系中最红的天体之一。", "es": "Uno de los objetos más rojos del sistema solar.", "fr": "L'un des objets les plus rouges du Système solaire."}, "Io": {"ja": "太陽系で最も火山活動が活発である。400を超える活火山がある。", os 20 km de altura.", "fr": "Elle abrite Verona Rupes, une falaise d'environ 20 km de haut."}, "Titania": {"ja": "天王星で最大の衛星である。", "zh": "是天王星最大的卫星。", "es": "La luna más grande de Urano.", "fr": "La plus grande lune d'Uranus."}, "Galatea": {"ja": "アダムズ環をつなぎとめる羊飼い衛星である。", "zh": "是约束亚当斯环的牧羊犬卫星。", "es": "La luna pastora del anillo de Adams.", "fr": "La lune bergère de l'anneau d'Adams."}, "Triton": {"ja": "逆向きに公転する大きな衛星である。ボイジャー2号が窒素の間欠泉を撮影した。", "zh": "反向公转的大型卫星。旅行者2号拍到了氮间歇泉。", "es": "Una luna grande con órbita retrógrada; el Voyager 2 fotografió géiseres de nitrógeno.", "fr": "Une grande lune sur une orbite rétrograde ; Voyager 2 y a photographié des geysers d'azote."}, "Nereid": {"ja": "軌道が非常にゆがんでいる（離心率0.75。ここでは円に単純化）。", "zh": "轨道极扁（偏心率0.75，此处简化为圆形）。", "es": "Órbita muy excéntrica (0,75), simplificada aquí como un círculo.", "fr": "Orbite très excentrique (0,75), simplifiée ici en cercle."}, "Charon": {"ja": "冥王星の直径の半分を超えるため、二つは共通の重心のまわりを回っている。北極に赤い「モルドール斑」がある。", "zh": "直径超过冥王星的一半，因此两者围绕共同的质心运转。北极有红色的“魔多斑”。", "es": "Mide más de la mitad que Plutón, así que ambos orbitan alrededor de un centro de masas común. Su polo norte presenta la «Mordor Macula», de tono rojizo.", "fr": "Plus de la moitié de la taille de Pluton : les deux astres tournent autour d'un centre de masse commun. Son pôle nord porte la « Mordor Macula », rougeâtre."}}, "retro": {"ja": "逆向きに公転する。", "zh": "沿相反方向公转。", "es": "Orbita en sentido contrario (retrógrado).", "fr": "Elle orbite à contre-sens (rétrograde)."}, "nameFr": {"sun": "Soleil", "mercury": "Mercure", "venus": "Vénus", "earth": "Terre", "mars": "Mars", "jupiter": "Jupiter", "saturn": "Saturne", "uranus": "Uranus", "neptune": "Neptune", "pluto": "Pluton", "Moon": "Lune", "Phobos": "Phobos", "Deimos": "Déimos", "Metis": "Métis", "Adrastea": "Adrastée", "Amalthea": "Amalthée", "Thebe": "Thébé", "Io": "Io", "Europa": "Europe", "Ganymede": "Ganymède", "Callisto": "Callisto", "Leda": "Léda", "Himalia": "Himalia", "Lysithea": "Lysithéa", "Elara": "É function thumb(b,size){
  const s=size*2,cv=document.createElement('canvas'); cv.width=cv.height=s; const c=cv.getContext('2d');
  const hasRing=b.id==='saturn', src=b.mesh.material.map.image, R=s*(hasRing?0.3:0.42), cx=s/2, cy=s/2;
  const ring=(front)=>{ c.save(); c.translate(cx,cy); c.rotate(-0.35); c.scale(1,0.32);
    c.beginPath(); c.arc(0,0,R*1.95,front?0:Math.PI,front?Math.PI:TAU); c.lineWidth=R*0.55; c.strokeStyle=b.id==='saturn'?'rgba(214,196,158,.85)':'rgba(140,140,150,.35)'; c.stroke(); c.restore(); };
  if(hasRing) ring(false);
  if(b.isSun){ const g=c.createRadialGradient(cx,cy,R*0.6,cx,cy,s/2); g.addColorStop(0,'rgba(255,190,100,.55)'); g.addColorStop(1,'rgba(255,150,60,0)'); c.fillStyle=g; c.fillRect(0,0,s,s); }
  c.save(); c.beginPath(); c.arc(cx,cy,R,0,TAU); c.clip();
  c.drawImage(src,src.width*0.25,0,src.width*0.5,src.height,cx-R,cy-R,R*2,R*2);
  if(b.clouds&&b.clouds.material.map){ const ci=b.clouds.material.map.image; c.globalAlpha=0.8; c.drawImage(ci,ci.width*0.25,0,ci.width*0.5,ci.height,cx-R,cy-R,R*2,R*2); c.globalAlpha=1; }
  if(!b.isSun){ const g=c.createRadialGradient(cx-R*0.45,cy-R*0.45,R*0.1,cx,cy,R*1.05); g.addColorStop(0,'rgba(255,255,255,.12)'); g.addColorStop(0.55,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.72)'); c.fillStyle=g; c.fillRect(0,0,s,s); }
  c.restore(); if(hasRing) ring(true);
  return cv.toDataURL();
}

const rnd=Math.random, gauss=()=>(rnd()+rnd()+rnd()-1.5)/1.5;

/* ═════════ 첫 화면 연출: 지구에서 시작해 태양계 전체로 멀어진다 ═════════ */

function runIntro(){
  introOn=true; document.body.classList.add('intro'); $('intro').hidden=false; controls.enabled=false;
  state.speed=1/1440; syncSpeed(); // 첫 화면은 1초에 1분: 한반도가 화면에서 벗어나지 않게

const ease=x=>x<.5? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;
function stepCamera(dt){
  const tgt=state.focus? worldPos(state.focus,new THREE.Vector3()) : new THREE.Vector3();
  if(flight){ flight.t=Math.min(1,flight.t+dt/(flight.dur||1.5)); const e=ease(flight.t),to=flight.toOrigin? new THREE.Vector3():tgt;
    controls.target.lerpVectors(flight.fromT,to,e);
    const a=flight.fromC.clone().sub(flight.fromT),la=Math.log(Math.max(a.length(),1e-9)),lb=Math.log(flight.dist);
    camera.position.copy(controls.target).addScaledVector(a.normalize().lerp(flight.dir,e).normalize(),Math.exp(la+(lb-la)*e));
    if(flight.t>=1) flight=null; lastTarget.copy(to); }
  else if(state.focus){ const delta=tgt.clone().sub(lastTarget); camera.position.add(delta); controls.target.add(delta); lastTarget.copy(tgt); }

    cosCmb=m; addItem(m,[3e10,1.2e11,Infinity,Infinity],v=>{ mat.uniforms.op.value=v*0.55; }); }
  // 태양 표시
  { const cv=document.createElement('canvas'); cv.width=cv.height=128; const c=cv.getContext('2d'), g=c.createRadialGradient(64,64,0,64,64,64);
    g.addColorStop(0,'rgba(255,240,200,1)'); g.addColorStop(0.2,'rgba(255,200,120,.7)'); g.addColorStop(1,'rgba(255,150,60,0)'); c.fillStyle=g; c.fillRect(0,0,128,128);
    const tx=new THREE.CanvasTexture(cv); sunSprite=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));
    addItem(sunSprite,[0,0,1.5e5,1.5e6],v=>{ sunSprite.material.opacity=v; }); }
  // 이름표
  const cmbP=new THREE.Vector3(0.35,0.55,0.76).normalize().multiplyScalar(4.4e10);
  cosLabelDefs.push({k:'sun',p:new THREE.Vector3(),w:[0,0,1.2e5,6e5],here:true},{k:'mw',p:gc,w:[3e4,1.2e5,3e6,1e7]},{k:'lmc',p:lmc,w:[5e4,1.5e5,1.5e6,5e6]},{k:'smc',p:smc,w:[5e4,1.5e5,1.5e6,5e6]},
    {k:'m31',p:m31,w:[8e5,3e6,1e8,4e8]},{k:'dist',p:gc.clone().lerp(m31,0.5),w:[1.5e6,4e6,2.5e7,8e7]},{k:'m33',p:m33,w:[1.5e6,4e6,6e7,2e8]},{k:'here',p:gc,w:[3e6,1e7,2e9,8e9],here:true},{k:'ga',p:GA,w:[6e7,3e8,6e9,2.5e10]},{k:'cmb',p:cmbP,w:[4e10,1.2e11,Infinity,Infinity]});
  const box=$('cosLabels'); cosLabelDefs.forEach(L=>{ const el=document.createElement('div'); el.className='cl'+(L.here?' here':''); el.innerHTML='<i></i><span></span>'; box.append(el); L.el=el; }); relabelCos();
  // 장면별 카메라(목표점, 바라보는 방향, 거리)
  const side=m31Dir.clone().cross(gp).normalize(), side2=gaDir.clone().cross(gp).normalize();
  cosStages={
    start:{t:new THREE.Vector3(),dir:gp.clone().multiplyScalar(0.55).addScaledVector(gcDir,-0.8).normalize(),dist:1500},
    3:{t:gc.clone().multiplyScalar(0.8),dir:gp.clone().multiplyScalar(0.9).addScaledVector(gcDir,-0.45).normalize(),dist:1.55e5},
    4:{t:gc.clone().lerp(m31,0.42),dir:side.clone().multiplyScalar(0.85).addScaledVector(gp,0.35).normalize(),dist:3.0e6,
       lineUp:side.clone().multiplyScalar(0.85).addScaledVector(gp,0.35).normalize().cross(m31.clone().sub(gc).normalize()).normalize()},
    5:{t:GA.clone().multiplyScalar(0.93),dir:side2.clone().multiplyScalar(0.65).addScaledVector(gp,0.6).normalize(),dist:8e8},
    6:{t:new THREE.Vector3(),dir:side2.clone().multiplyScalar(0.8).addScaledVector(gp,0.45).normalize(),dist:1.45e11}
  };
}
function relabelCos(){ const L=t('cl'); cosLabelDefs.forEach(d=>{ if(d.el) d.el.querySelector('span').textContent=L[d.k]; }); }
function initCos(){ cosCam.aspect=camera.aspect; cosCam.updateProjectionMatrix();
  cosControls=new THREE.OrbitControls(cosCam,canvas); cosControls.enabled=false; cosControls.enableDamping=true; cosControls.dampingFactor=0.08; cosControls.zoomSpeed=2; cosControls.minDistance=50; cosControls.maxDistance=3e11; }
const Y_UP=new THREE.Vector3(0,1,0);
const stageUp=st=>{ if(!(st.lineUp&&camera.aspect>=1)) return Y_UP; return st.lineUp.dot(Y_UP)<0? st.lineUp.clone().negate() : st.lineUp; };
// 국부은하군은 우리은하–안드로메다(250만 광년)가 화면 폭(세로 화면은 높이)의 약 60%를 차지하게
const stageDist=st=> st.lineUp? (camera.aspect>=1? 4.4e6/camera.aspect : 4.6e6) : st.dist*fitK();
function cosPlace(st){ cosCam.up.copy(stageUp(st)); cosControls.target.copy(st.t); cosCam.position.copy(st.t).addScaledVector(st.dir,stageDist(st)); cosCam.lookAt(st.t); }
function cosGo(st,dur){ cosFlight={t:0,dur,fromT:cosControls.target.clone(),fromC:cosCam.position.clone(),toT:st.t.clone(),dir:st.dir.clone(),dist:stageDist(st),fromUp:cosCam.up.clone(),toUp:stageUp(st).clone()}; }
function stepCos(dt){
  if(cosFlight){ const f=cosFlight; f.t=Math.min(1,f.t+dt/f.dur); const e=ease(f.t);
    const a=f.fromC.clone().sub(f.fromT), d0=Math.max(a.length(),1e-6), D=Math.exp(Math.log(d0)+(Math.log(f.dist)-Math.log(d0))*e);
    const frac= Math.abs(f.dist-d0)>1e-9? Math.max(0,Math.min(1,(D-d0)/(f.dist-d0))) : e; // 멀어지는 만큼만 목표점을 옮겨 화면이 튀지 않게
    cosControls.target.lerpVectors(f.fromT,f.toT,frac);
    cosCam.up.copy(f.fromUp).lerp(f.toUp,e).normalize();
    cosCam.position.copy(cosControls.target).addScaledVector(a.normalize().lerp(f.dir,e).normalize(),D); cosCam.lookAt(cosControls.target);
    if(f.t>=1) cosFlight=null; }
  else if(cosControls.enabled) cosControls.update();
  const d=cosCam.position.distanceTo(cosControls.target);
  cosItems.forEach(it=>{ const v=win(d,it.w)*cosG; it.obj.visible=v>0.003; it.setOp(v); });
  COS_TIME.value+=dt;
  if(cosWeb){ cosWeb.rotation.y+=dt*0.0091; cosWeb.material.uniforms.att.value=cosCam.position.length(); if(cosCmb) cosCmb.rotation.y=cosWeb.rotation.y; }
  if(sunSprite) sunSprite.scale.setScalar(cosCam.position.length()*0.03);
}
const _cp=new THREE.Vector3();
function updateCosLabels(){ const w=canvas.clientWidth,h=canvas.clientHeight, d=cosCam.position.distanceTo(cosControls.target);
  cosLabelDefs.forEach(L=>{ const a=win(d,L.w); _cp.copy(L.p).project(cosCam); const show=a>0.02&&_cp.z<1&&_cp.z>-1;
    L.el.style.display=show?'':'none'; if(!show) return; L.el.style.opacity=a.toFixed(2);
    const lx=Math.min((_cp.x*0.5+0.5)*w-4.5, w-L.el.offsetWidth-8); L.el.style.transform='translate('+Math.max(4,lx).toFixed(1)+'px,'+((-_cp.y*0.5+0.5)*h).toFixed(1)+'px) translateY(-50%)'; }); }

/* 여행 진행 */
let cosG=1; // 우주 장면 전체 밝기(이어 붙일 때 서서히)
function beginBlend(){ flight=null; state.focus=null;
  const dir=camera.position.clone().sub(controls.target).normalize(), base=camera.position.distanceTo(controls.target);
  state.blend={dir,base,d0:0.004}; cosFlight=null; cosControls.target.set(0,0,0); cosCam.position.copy(dir).multiplyScalar(0.004); cosCam.lookAt(0,0,0);
  cosG=0; document.body.classList.add('cosmic'); $('cosLabels').hidden=false; }
function stepBlend(dt){ const B=state.blend; stepCos(dt);
  const d=cosCam.position.distanceTo(cosControls.target), r=d/B.d0, dir=cosCam.position.clone().sub(cosControls.target).normalize();
  // 태양계 카메라를 우주 카메라와 '태양 중심 같은 비율'로 맞춘다: 같은 방향·같은 회전 → 두 장면의 태양이 화면 같은 자리에 겹친다
  controls.target.copy(cosControls.target).multiplyScalar(B.base/B.d0); camera.position.copy(cosCam.position).multiplyScalar(B.base/B.d0); camera.quaternion.copy(cosCam.quaternion);
  const g=sm01(Math.log10(Math.max(r,1))/1.3); cosG=g; stars.material.opacity=1-g;
  renderer.autoClear=false; renderer.clear(); renderer.render(scene,camera); renderer.clearDepth(); renderer.render(cosScene,cosCam); renderer.autoClear=true; updateCosLabels();
  if(r>300) endBlend(); }
function endBlend(){ state.blend=null; cosG=1; stars.material.opacity=1; setCosmic(true); }
function setCosmic(on){ state.cosmic=on; document.body.classList.toggle('cosmic',on); $('cosLabels').hidden=!on; if(!on) cosControls.enabled=false; }
async function fadeTo(fn){ $('fade').classList.add('on'); await sleep(650); fn(); await sleep(120); $('fade').classList.remove('on'); }
function renderAddr(){ const A=t('addr'), C=t('cap'); const tr=$('addrTrail'); tr.innerHTML='';
  for(let i=0;i<=Math.min(addrIdx,A.length-1);i++){ const s=document.createElement('span'); s.textContent=A[i]; tr.append(s); }
  if(tour&&tour.ended){ $('addrNow').textContent=t('tourEnd'); $('addrCap').textContent=''; }
  else { $('addrNow').textContent= addrIdx>=0? A[addrIdx] : ''; $('addrCap').textContent= addrIdx>=0? C[addrIdx] : ''; } }
async function setAddr(i){ if(window.SND&&i!==addrIdx) SND.sfx('addr',{step:i}); $('addrNow').classList.add('dim'); $('addrCap').classList.add('dim'); await sleep(280); addrIdx=i; renderAddr(); $('addrNow').classList.remove('dim'); $('addrCap').classList.remove('dim'); }
function koreaView(mult){ update(); scene.updateMatrixWorld(true);
  const ep=worldPos(earthB,new THREE.Vector3()), sunDir=ep.clone().negate().normalize(), up=new THREE.Vector3(0,1,0);
  const la=36.5*DEG, lo=127.8*DEG, kr=new THREE.Vector3(Math.cos(la)*Math.cos(lo),Math.sin(la),-Math.cos(la)*Math.sin(lo)).transformDirection(earthB.mesh.matrixWorld);
  const night=Math.max(0,-kr.dot(sunDir)); const dir=kr.addScaledVector(sunDir,night*0.55).addScaledVector(up,0.1).normalize();
  state.focus=earthB; flight=null; controls.target.copy(ep); lastTarget.copy(ep); camera.position.copy(ep).addScaledVector(dir,koreaDist()); }
function tourUIOn(){ closeSettings(); $('info').hidden=true; $('bday').hidden=true; document.body.classList.add('tour'); $('tour').hidden=false; $('tourEnd').hidden=true; $('tourSkip').hidden=false; controls.enabled=false; cosControls.enabled=false; }
async function startTour(asIntro){
  const tok={ended:false,intro:!!asIntro}; tour=tok; if(window.SND) SND.scene('tour');
  const T= asIntro? {k:1967,e:2822,s:3420,g:5.56,st:[[4,3.85],[5,3.85],[6,4.28]],gap:513} : {k:2970,e:3870,s:4500,g:7.2,st:[[4,5.4],[5,5.85],[6,6.3]],gap:810}; tourUIOn(); addrIdx=-1; renderAddr();
  if(!cosBuilt) cosBuilt=buildCos();
  if(state.cosmic) await fadeTo(()=>setCosmic(false));
  if(tour!==tok) return;
  state.speed=1/1440; syncSpeed(); if(state.paused) togglePause();
  koreaView(1.8);
  setAddr(0); await sleep(T.k); if(tour!==tok) return;
  setAddr(1); flyFollow(earthB,earthB.dispR*4.6*fitK(),T.e/1200,0.2); await sleep(T.e); if(tour!==tok) return;
  setAddr(2); flyHome(T.s/1200); await sleep(T.s); if(tour!==tok) return;
  await cosBuilt; if(tour!==tok) return;
  beginBlend(); setAddr(3); cosGo(cosStages[3],T.g); await sleep(T.g*1000+T.gap); if(tour!==tok) return;
  for(const [i,dur] of T.st){ if(tour!==tok) return; setAddr(i); cosGo(cosStages[i],dur); await sleep(dur*1000+T.gap); }
  if(tour!==tok) return; finishTourUI();
}
function finishTourUI(){ if(!tour) return; tour.ended=true; if(window.SND) SND.sfx('arrive'); addrIdx=6; setAddr(6).then(()=>{ $('addrNow').textContent=t('tourEnd'); $('addrCap').textContent=''; });
  cosControls.autoRotate=true; cosControls.autoRotateSpeed=0.114; // 둘을 합쳐 한 바퀴 약 5분
  $('tourEnd').hidden=false; $('tourAgain').hidden=!!tour.intro; $('tourBday').hidden=!tour.intro; $('tourSkip').hidden=true; cosControls.enabled=true; }
async function skipTour(){ const tok={ended:false,intro:!!(tour&&tour.intro)}; tour=tok; flight=null;
  if(!cosBuilt) cosBuilt=buildCos(); await cosBuilt; if(tour!==tok) return;
  const go=()=>{ if(state.blend) endBlend(); setCosmic(true); cosFlight=null; cosPlace(cosStages[6]); };
  if(state.cosmic) go(); else await fadeTo(go);
  finishTourUI(); }
async function endTour(){ tour=null; if(window.SND) SND.scene('explore'); if(state.blend) endBlend();
  await fadeTo(()=>{ setCosmic(false); state.focus=null; flight=null; controls.target.set(0,0,0); camera.position.set(0,0.55,1).normalize().multiplyScalar(homeDist()); lastTarget.set(0,0,0); });
  document.body.classList.remove('tour'); $('tour').hidden=true; controls.enabled=true; controls.minDistance=state.mode==='real'?0.001:0.5;
  state.speed=DEFAULT_SPEED; $('speed').value=sliderFromSpeed(DEFAULT_SPEED); syncSpeed(); markPicker(); }

/* ═════════ 시작 ═════════ */
let lastT=performance.now(),tick=0;
function loop(now){
  const raw=Math.max(0,(now-lastT)/1000),dt=Math.min(0.1,raw); lastT=now;
  if(!state.paused){ const dd=state.speed*dt*state.dir; orbitDays+=dd*state.orbitMul; rotDays+=dd*state.rotMul; }
  if(state.target!=null&&orbitDays>=state.target){ orbitDays=rotDays=(Date.now()-J2000)/864e5; state.target=null; state.speed=1/86400; $('speed').value=sliderFromSpeed(state.speed); syncSpeed(); }
  update(); if(state.hist&&window.HIST) HIST.frame(Math.min(raw,0.5));
  if(!state.cosmic&&!state.blend){ stepCamera(Math.min(raw,0.5)); controls.update(); } if(state.hist&&window.HIST&&HIST.post) HIST.post(); stars.position.copy(camera.position);
  if(mouse&&tick%3===0){ const b=pick(mouse[0],mouse[1]); if(b!==hovered) setHover(b); }
  if(state.blend){ stepBlend(Math.min(raw,0.5)); }
  else if(state.cosmic){ stepCos(Math.min(raw,0.5)); renderer.render(cosScene,cosCam); updateCosLabels(); }
  else if(state.hist&&window.HIST&&HIST.custom){ renderer.render(HIST.scene,camera); HIST.labels(); }
  else { renderer.render(scene,camera); updateLabels(); }
  if(tick%4===0) syncSheet();
  if(++tick%6===0){ const note=(state.orbitMul!==1||state.rotMul!==1)? '<small>'+t('dateNote')+'</small>':''; $('clock').innerHTML=clockText()+note; liveInfo(); }
  requestAnimationFrame(loop);
}
function init(){
  sun=buildSun(); for(const p of PLANETS){ const b=buildPlanet(p); if(p.id==='jupiter') jupiter=b; if(p.id==='earth') earthB=b; }
  for(const m of MOONS) buildMoon(m,bodies.find(b=>b.id===m[1]));
  buildBelts(); buildStars();
  for(const b of bodies) b.thumb=thumb(b,b.isMoon?48:72);
  state.sizeMul=sizeFromSlider(52); resize(); layout(); update(); applyVis();
  loadEarthPhotos();
  buildPicker(); bindIntroBday(); initCos(); applyLang();
  controls.minDistance=0.01;
  window.OU={THREE,scene,camera,controls,renderer,canvas,state,bodies,D,kepler,orbitPoint,nameOf,t,fmt,J2000,MOBILE,applyVis,focusOn,overview,fitK,
    lang:()=>lang, body:id=>bodies.find(b=>b.id===id), byName:n=>bodies.find(b=>b.names&&b.names[1]===n),
    getDays:()=>orbitDays, setDays:d=>{ orbitDays=rotDays=d; state.target=null; },
    setSpeed:d=>{ state.speed=d; state.dir=1; $('revBtn').classList.remove('on'); $('speed').value=sliderFromSpeed(d); syncSpeed(); if(state.paused) togglePause(); },
    resetSpeed:()=>OU.setSpeed(DEFAULT_SPEED),
    clearFocus:()=>{ state.focus=null; flight=null; $('info').hidden=true; markPicker(); },
    home:()=>{ state.focus=null; flight=null; controls.target.set(0,0,0); camera.position.set(0,0.55,1).normalize().multiplyScalar(homeDist()); lastTarget.set(0,0,0);
      controls.minDistance=state.mode==='real'?0.001:0.5; controls.maxDistance=(state.mode==='real'?9000:140)*6; markPicker(); },
    hidePanels:()=>{ $('info').hidden=true; $('bday').hidden=true; closeSettings(); },
    earthMap:()=>earthB.earthMat.map, sunMap:()=>sun.mesh.material.map};
  if(window.HIST) HIST.init(OU);
  $('loading').hidden=true; requestAnimationFrame(loop);
  // 뒤쪽 탭에서 열렸다면 화면에 보일 때 첫 화면 연출을 시작
  let visits=1; try{ visits=(parseInt(localStorage.getItem('ou-visits'),10)||0)+1; localStorage.setItem('ou-visits',String(visits)); }catch(e){}
  const pickIntro=()=> (visits%2===1)? startTour(true) : runIntro(); // 첫 방문=2안(우주 주소), 다음=1안, 그 뒤 번갈아
  if(document.hidden){ const go=()=>{ if(!document.hidden){ document.removeEventListener('visibilitychange',go); pickIntro(); } }; document.addEventListener('visibilitychange',go); } else pickIntro();
}
applyLang();
setTimeout(()=>(()=>{ try{ init(); }catch(err){ $('loadStep').textContent=err.message; console.error(err); } })(),60);
})();
</script>
